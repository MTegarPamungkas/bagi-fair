name: bagi_fair
description: "Bagi Fair - split bill kolaboratif. Bagi adil, tanpa baper."
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  meta: ^1.16.0
  supabase_flutter: ^2.18.3
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  file_saver: ^0.7.0
  pdf: ^3.13.1
  app_links: ^6.4.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/Bricolage-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-Bold.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
